version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelmind
      POSTGRES_USER: travelmind_user
      POSTGRES_PASSWORD: travelmind_password_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmind_user -d travelmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: travelmind_backend
    restart: unless-stopped
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - ./algorithms:/app/algorithms
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=insecure-dev-key-change-in-production-min-50-characters-long
      - DATABASE_URL=postgres://travelmind_user:travelmind_password_dev_only@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: travelmind_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l INFO
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./algorithms:/app/algorithms
    environment:
      - DATABASE_URL=postgres://travelmind_user:travelmind_password_dev_only@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: travelmind_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l INFO
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./algorithms:/app/algorithms
    environment:
      - DATABASE_URL=postgres://travelmind_user:travelmind_password_dev_only@postgres:5432/travelmind
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: travelmind_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
